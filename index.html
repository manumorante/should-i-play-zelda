<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Should I play Zelda? · ¿Debería jugar a Zelda?</title>
<meta name="description" content="A completely scientific test. Every answer is valid. The result is inevitable.">
<meta property="og:title" content="Should I play Zelda? The test">
<meta property="og:description" content="A completely scientific test. The result is inevitable.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#04120b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Verde bosque */
    --g0:#04120b; --g1:#082116; --g2:#0e3322; --g3:#15482f; --g4:#1f6440;
    --ink:#f3ecd2; --muted:#b9c4a8;
    /* Oro metálico: sombras profundas, cuerpo cálido y brillos casi blancos */
    --gold: linear-gradient(135deg,
      #6b4a0e 0%, #b8862b 12%, #f6e08e 24%, #fffbe6 30%, #e8c25a 38%,
      #a8771d 50%, #d9ae45 62%, #fff1b8 72%, #c79a32 82%, #7a5512 100%);
    --gold-v: linear-gradient(180deg, #fff4c4 0%, #f1cf6b 22%, #c8962e 50%, #8f6315 72%, #e0b74e 100%);
    --gold-solid:#d6ac48;
    --ruby: radial-gradient(circle at 32% 28%, #ffd2d2 0 8%, #ff5a5a 22%, #b3121b 58%, #4d0408 100%);
    --emerald: radial-gradient(circle at 32% 28%, #e4ffe9 0 8%, #4fe08a 22%, #128a45 58%, #03361a 100%);
    --topaz: radial-gradient(circle at 32% 28%, #fffbe6 0 8%, #ffd970 22%, #c08a1c 58%, #573a05 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--g0)}
  body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);font-size:19px;line-height:1.35;
       display:flex;justify-content:center;padding:14px;height:100vh;height:100dvh;
       background:
         radial-gradient(ellipse at 50% -10%, rgba(214,172,72,.18), transparent 55%),
         radial-gradient(ellipse at 50% 110%, #1a5a37 0%, transparent 60%),
         var(--g0)}
  .app{width:100%;max-width:520px;height:100%;max-height:880px;display:flex;flex-direction:column}

  /* ---------- texto dorado ---------- */
  .gt{background:var(--gold);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 1px 0 rgba(60,35,0,.9)) drop-shadow(0 3px 6px rgba(0,0,0,.55));
      animation:shine 6s linear infinite}
  @keyframes shine{from{background-position:0% 0}to{background-position:250% 0}}

  .brand{display:flex;flex-direction:column;align-items:center;margin:2px 0 10px}
  .top{display:flex;justify-content:flex-end;margin:0 2px 6px}
  .lang{display:flex;padding:2px;border-radius:999px;background:var(--gold);box-shadow:0 4px 12px -4px #000}
  .lang button{font:800 16px Nunito,sans-serif;letter-spacing:.06em;border:none;cursor:pointer;padding:7px 14px;border-radius:999px;
       background:var(--g1);color:var(--gold-solid);transition:background .25s,color .25s}
  .lang button:first-child{border-radius:999px 0 0 999px;margin-right:1px}
  .lang button:last-child{border-radius:0 999px 999px 0}
  .lang button.on{background:transparent;color:#2b1a02;text-shadow:0 1px 0 rgba(255,245,200,.7)}
  .brand .t{font-family:Cinzel,serif;font-weight:800;font-size:clamp(24px,6.6vw,32px);letter-spacing:.03em;text-align:center;line-height:1.1}
  .divider{width:78%;height:18px;margin-top:6px}

  /* ---------- tarjeta con marco de oro ---------- */
  .frame{position:relative;flex:1;min-height:0;border-radius:24px;padding:3px;background:var(--gold);
         box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 20px 50px -20px #000, 0 0 40px -10px rgba(214,172,72,.35)}
  .card{position:relative;height:100%;border-radius:21px;padding:26px 20px 0;overflow:hidden;display:flex;flex-direction:column;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(80,170,110,.22), transparent 60%),
          repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px),
          linear-gradient(180deg,var(--g2),var(--g1));
        box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), inset 0 0 0 5px var(--g1), inset 0 0 0 6px rgba(214,172,72,.45)}
  .corner{position:absolute;width:46px;height:46px;z-index:3;pointer-events:none}
  .corner.tl{top:7px;left:7px}.corner.tr{top:7px;right:7px;transform:scaleX(-1)}
  .corner.bl{bottom:15px;left:7px;transform:scaleY(-1)}.corner.br{bottom:15px;right:7px;transform:scale(-1)}

  .body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;margin:0 -4px;padding:0 4px 2px;position:relative;z-index:2}
  .qn{font-family:Cinzel,serif;font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-bottom:6px;color:var(--gold-solid)}
  h1{font-family:Cinzel,serif;font-size:29px;font-weight:700;line-height:1.2;margin-bottom:20px;text-align:center;color:var(--ink);
     text-shadow:0 2px 8px rgba(0,0,0,.6)}

  /* ---------- opciones ---------- */
  .opts{display:flex;flex-direction:column;gap:14px;flex:1}
  .opt{--px:50%;--py:50%;display:flex;align-items:center;gap:16px;width:100%;flex:1;min-height:66px;max-height:108px;
       border:2px solid transparent;border-radius:18px;padding:14px 16px;
       background:linear-gradient(180deg,#123c28,#0b2a1b) padding-box, var(--gold) border-box;
       font:inherit;font-family:Cinzel,serif;font-weight:700;font-size:23px;color:var(--ink);cursor:pointer;text-align:left;
       position:relative;overflow:hidden;transition:transform .2s, box-shadow .3s;
       box-shadow:0 8px 18px -10px #000, inset 0 1px 0 rgba(255,255,255,.06);
       animation:optIn .45s cubic-bezier(.2,.8,.2,1) backwards}
  .opt::after{content:"";position:absolute;left:var(--px);top:var(--py);width:900px;height:900px;border-radius:50%;
       background:radial-gradient(circle, rgba(255,226,140,.20), rgba(255,226,140,.07) 60%);
       transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;transition:transform .3s ease-in,opacity .3s}
  .opt::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,246,200,.35) 50%,transparent 65%);
       transform:translateX(-120%);pointer-events:none;z-index:2}
  .opt > *{position:relative;z-index:1}
  .gem{width:30px;flex:none;text-align:center;font-size:24px;font-family:Nunito;font-weight:800;color:var(--gold-solid);transition:color .3s, transform .3s}
  .opt:active{transform:scale(.97)}
  .opt.sel{transform:translateY(-2px);background:linear-gradient(180deg,#2f5530,#173a22) padding-box, var(--gold) border-box;box-shadow:0 14px 26px -12px #000, 0 0 18px rgba(255,220,120,.5)}
  .opt.sel::after{transform:translate(-50%,-50%) scale(1);opacity:1;transition:transform .75s cubic-bezier(.4,0,.2,1),opacity .15s}
  .opt.sel::before{animation:sweep .7s ease-out .05s forwards}
  .opt.sel .gem{color:#fff1b8;transform:scale(1.15)}
  .opt.sel{animation:optpop .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes optpop{0%{transform:scale(.97)}45%{transform:scale(1.035) translateY(-3px)}100%{transform:translateY(-2px)}}
  @keyframes optIn{from{opacity:0;transform:translateY(12px)}}
  @keyframes sweep{to{transform:translateX(120%)}}
  .opts.locked .opt{pointer-events:none}

  /* ---------- pantallas de mensaje ---------- */
  .msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:8px 6px}
  .msg .emo{font-size:74px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
  .msg .big{font-family:Cinzel,serif;font-size:40px;font-weight:800;line-height:1.1}
  .msg .big.bad{color:#ff6b6b;background:none;filter:none;text-shadow:0 0 18px rgba(255,60,60,.55),0 2px 0 #4d0408}
  .msg p{font-size:21px}
  .msg .small{font-size:18px;color:var(--muted)}
  .shake{display:inline-block;animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{15%,85%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}45%,55%{transform:translateX(-7px) rotate(-3deg)}50%{transform:translateX(7px) rotate(3deg)}}
  .reveal{animation:rev .55s cubic-bezier(.3,1.4,.5,1) backwards}
  @keyframes rev{from{opacity:0;transform:translateY(14px) scale(.96)}}
  .card.beat::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
       background:radial-gradient(circle at 50% 35%,rgba(255,50,50,.32),transparent 70%);animation:beat 1.3s ease-out forwards;opacity:0}
  @keyframes beat{0%{opacity:0}12%{opacity:1}24%{opacity:.25}36%{opacity:.9}100%{opacity:0}}

  /* ---------- final ---------- */
  .medal{width:132px;height:132px;animation:rise .9s cubic-bezier(.3,1.4,.5,1) backwards, float 3.5s ease-in-out 1s infinite}
  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.5) rotate(-25deg)}}
  @keyframes float{50%{transform:translateY(-6px)}}
  .medal-wrap{position:relative;display:flex;justify-content:center}
  .rays-clip{position:absolute;left:50%;top:50%;width:280px;height:280px;transform:translate(-50%,-50%);
        border-radius:50%;overflow:hidden;pointer-events:none;z-index:0}
  .rays{position:absolute;inset:0;background:repeating-conic-gradient(rgba(255,226,140,.14) 0 6deg, transparent 6deg 18deg);
        -webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);
        animation:spin 30s linear infinite}
  .medal{position:relative;z-index:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .win{position:relative}
  .win > *{position:relative;z-index:1}
  .win .big{font-size:38px}
  .path{width:100%;border-radius:16px;font-size:17px;text-align:left;
        background:linear-gradient(180deg,#0f3322,#0a2617) padding-box, var(--gold) border-box;border:1.5px solid transparent}
  .path summary{list-style:none;cursor:pointer;padding:12px 14px;font-family:Cinzel,serif;font-weight:700;display:flex;justify-content:space-between;color:var(--gold-solid)}
  .path summary::-webkit-details-marker{display:none}
  .path summary::after{content:"+";font-size:22px;line-height:1}
  .path[open] summary::after{content:"–"}
  .path ol{padding:0 14px 12px 36px;display:flex;flex-direction:column;gap:6px}
  .path b{color:#f6d77a}

  /* ---------- inicio ---------- */
  .start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:6px 4px}
  .start .medal{width:118px;height:118px}
  .start .kick{font-family:Cinzel,serif;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-solid)}
  .start h1.hero{font-size:clamp(36px,10.5vw,50px);font-weight:800;line-height:1.08;margin:0;text-shadow:none}
  .start .lead{font-size:20px;max-width:24ch}
  .start .btn.go{flex:none;width:100%;font-size:21px;padding:18px 10px;margin-top:6px}
  .start .meta{font-size:17px;color:var(--muted)}
  .lang{display:flex;padding:2px;border-radius:999px;background:var(--gold);box-shadow:0 4px 12px -4px #000;margin-top:4px}
  .lang button{font:800 17px Nunito,sans-serif;letter-spacing:.04em;border:none;cursor:pointer;padding:9px 18px;
       background:var(--g1);color:var(--gold-solid);transition:background .25s,color .25s}
  .lang button:first-child{border-radius:999px 0 0 999px;margin-right:1px}
  .lang button:last-child{border-radius:0 999px 999px 0}
  .lang button.on{background:transparent;color:#2b1a02;text-shadow:0 1px 0 rgba(255,245,200,.7)}

  /* ---------- botones ---------- */
  .actions{display:flex;gap:10px;margin-top:14px;flex-shrink:0;position:relative;z-index:2}
  .btn{flex:1;border-radius:16px;padding:16px 10px;font:inherit;font-family:Cinzel,serif;font-weight:800;font-size:19px;cursor:pointer;
       border:2px solid transparent;position:relative;overflow:hidden;transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn.back{flex:0 0 38%;color:var(--gold-solid);background:linear-gradient(180deg,#123c28,#0b2a1b) padding-box, var(--gold) border-box}
  .btn.go{color:#2b1a02;background:var(--gold-v);border-color:#5a3d08;text-shadow:0 1px 0 rgba(255,245,200,.7);
          box-shadow:inset 0 2px 0 rgba(255,255,255,.65), inset 0 -3px 0 rgba(90,55,0,.45), 0 10px 22px -8px rgba(214,172,72,.55)}
  .btn.go::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);
          transform:translateX(-130%);animation:sweep 2.8s ease-in-out 1s infinite}
  .btn.go.red{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);border-color:#3a0306;
          background:linear-gradient(180deg,#ff8a8a 0%,#e0303a 30%,#9c0f17 75%,#d93a40 100%);
          box-shadow:inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.35), 0 0 0 2px var(--gold-solid), 0 10px 22px -8px rgba(220,40,40,.6)}
  .btn.go.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.07) translateY(-2px)}100%{transform:scale(1)}}

  /* ---------- progreso ---------- */
  .progress{flex-shrink:0;height:10px;margin:18px -20px 0;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(214,172,72,.4)}
  .progress span{display:block;height:100%;background:var(--gold);background-size:200% 100%;animation:shine 3s linear infinite;
                 border-radius:0 999px 999px 0;transition:width .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(255,220,120,.6)}
  .foot{font-size:15px;color:var(--muted);text-align:center;margin-top:12px;font-style:italic}

  /* ---------- transiciones ---------- */
  .body.in-next{animation:inNext .4s cubic-bezier(.2,.8,.2,1)}
  .body.in-back{animation:inBack .4s cubic-bezier(.2,.8,.2,1)}
  .body.out-next{animation:outNext .2s ease-in forwards}
  .body.out-back{animation:outBack .2s ease-in forwards}
  @keyframes inNext{from{opacity:0;transform:translateX(40px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes inBack{from{opacity:0;transform:translateX(-40px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes outNext{to{opacity:0;transform:translateX(-40px) scale(.98)}}
  @keyframes outBack{to{opacity:0;transform:translateX(40px) scale(.98)}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
</style>
</head>
<body>
<!-- degradados de oro reutilizables para los adornos SVG -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="au" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6b4a0e"/><stop offset=".2" stop-color="#d9ae45"/><stop offset=".35" stop-color="#fffbe6"/>
    <stop offset=".5" stop-color="#e8c25a"/><stop offset=".68" stop-color="#9c6e18"/><stop offset=".85" stop-color="#f6dc85"/><stop offset="1" stop-color="#7a5512"/>
  </linearGradient>
  <radialGradient id="auR" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#fffbe6"/><stop offset=".25" stop-color="#f6d77a"/><stop offset=".6" stop-color="#c08d2a"/><stop offset="1" stop-color="#6b4a0e"/>
  </radialGradient>
</defs></svg>
<canvas id="confetti"></canvas>
<div class="app">
  <div class="frame"><div class="card" id="card"></div>
    <svg class="corner tl" viewBox="0 0 46 46" aria-hidden="true"><path d="M3 30 V10 Q3 3 10 3 H30" fill="none" stroke="url(#au)" stroke-width="2.5"/><path d="M9 22 Q9 9 22 9" fill="none" stroke="url(#au)" stroke-width="1.5"/><circle cx="10" cy="10" r="3.4" fill="url(#auR)" stroke="#3a2705" stroke-width=".6"/></svg>
    <svg class="corner tr" viewBox="0 0 46 46" aria-hidden="true"><path d="M3 30 V10 Q3 3 10 3 H30" fill="none" stroke="url(#au)" stroke-width="2.5"/><path d="M9 22 Q9 9 22 9" fill="none" stroke="url(#au)" stroke-width="1.5"/><circle cx="10" cy="10" r="3.4" fill="url(#auR)" stroke="#3a2705" stroke-width=".6"/></svg>
  </div>
  <p class="foot" id="foot"></p>
</div>

<script>
const Y='#3fd57a', N='#ff4d55', G='#ffd25a';
const GEM={y:'var(--emerald)',n:'var(--ruby)',g:'var(--topaz)'};
// Estructura del flujo (sin textos): [icono, color, gema, destino]
const F={
  time:   {o:[['✓',Y,'y','END'],['✕',N,'n','job'],['⚔',G,'g','blasphemy']]},
  job:    {o:[['✓',Y,'y','quit'],['✕',N,'n','hobbies']]},
  quit:   {o:[['✓',Y,'y','quitit'],['✕',N,'n','hobbies']]},
  hobbies:{o:[['✓',Y,'y','newhobby'],['✕',N,'n','free']]},
  free:   {o:[['✓',Y,'y','END'],['✕',N,'n','liar']]},
  blasphemy:{msg:1, emo:'⚡', bad:1, to:'END'},
  quitit:   {msg:1, emo:'📜', to:'END'},
  newhobby: {msg:1, emo:'🗡️', to:'END'},
  liar:     {msg:1, emo:'🤥', bad:1, to:'free'}
};
const TXT={
 es:{
  title:'¿Deberías jugar a Zelda?', kick:'Test 100% científico', lead:'Responde con sinceridad. Da igual: el resultado ya está decidido.', startBtn:'Que decida el destino →', meta:'⏱ 30 segundos · 1 resultado posible', doc:'¿Debería jugar a Zelda? El test', foot:'Rigor científico: dudoso. Resultado: inevitable.',
  q:'Pregunta', back:'← Atrás', again:'↺ Otra vez', yes:'Sí', no:'No',
  time:{q:'¿Tienes tiempo?', o:['Sí','No','No para Zelda']},
  job:{q:'¿Tienes trabajo?'}, quit:{q:'¿Puedes dejarlo?'}, hobbies:{q:'¿Tienes aficiones?'}, free:{q:'¿Tienes tiempo libre?'},
  blasphemy:{big:'¡BLASFEMIA!', p:'Para Zelda siempre hay tiempo.', btn:'Perdón, jugaré'},
  quitit:{big:'Déjalo', p:'Recoge tus cosas con dignidad. Hyrule te necesita más que tu jefe.', btn:'Hecho'},
  newhobby:{big:'Haz de Zelda tu nueva afición', p:'Las otras aficiones lo entenderán.', btn:'Me parece justo'},
  liar:{big:'¡MENTIROSO!', p:'Todo el mundo tiene tiempo libre.', btn:'Vale, lo confieso'},
  lies:n=>`Mentiras hasta ahora: ${n}`,
  verdict:'Veredicto final', play:'Juega a<br>The Legend of Zelda', predicted:'Como estaba previsto desde la primera pregunta.',
  lied:n=>`Has mentido ${n} ${n===1?'vez':'veces'}. Hyrule te perdona.`,
  path:'Tu camino hasta aquí', direct:'Directo, sin rodeos. Así se hace.'
 },
 en:{
  title:'Should you play Zelda?', kick:'100% scientific test', lead:'Answer honestly. It doesn\'t matter: the result is already decided.', startBtn:'Let fate decide →', meta:'⏱ 30 seconds · 1 possible result', doc:'Should I play Zelda? The test', foot:'Scientific rigor: questionable. Result: inevitable.',
  q:'Question', back:'← Back', again:'↺ Again', yes:'Yes', no:'No',
  time:{q:'Do you have time?', o:['Yes','No','Not for Zelda']},
  job:{q:'Do you have a job?'}, quit:{q:'Can you quit it?'}, hobbies:{q:'Do you have hobbies?'}, free:{q:'Do you have free time?'},
  blasphemy:{big:'BLASPHEMY!', p:'There is always time for Zelda.', btn:'Sorry, I\'ll play'},
  quitit:{big:'Quit it', p:'Pack your things with dignity. Hyrule needs you more than your boss does.', btn:'Done'},
  newhobby:{big:'Make Zelda your new hobby', p:'Your other hobbies will understand.', btn:'Fair enough'},
  liar:{big:'LIAR!', p:'Everyone has free time.', btn:'Fine, I confess'},
  lies:n=>`Lies so far: ${n}`,
  verdict:'Final verdict', play:'Play<br>The Legend of Zelda', predicted:'Just as predicted from the very first question.',
  lied:n=>`You lied ${n} ${n===1?'time':'times'}. Hyrule forgives you.`,
  path:'Your path here', direct:'Straight to it, no excuses. That\'s the way.'
 }
};
const ORDER=['time','job','quit','hobbies','free'];
let L='en', cur='start', hist=[], picks=[], dir='next', lies=0, prevPct=0, cfx=0;
const card=document.getElementById('card');
const t=()=>TXT[L];
const optLabel=(node,i)=> (t()[node].o||[t().yes,t().no])[i];

function detectLang(){
  try{ const q=new URLSearchParams(location.search).get('lang'); if(q==='es'||q==='en') return q; }catch(_){}
  try{ const s=localStorage.getItem('lang'); if(s==='es'||s==='en') return s; }catch(_){}
  const langs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
  return langs.some(l=>/^es\b/i.test(l)) && /^es/i.test(langs[0]) ? 'es' : 'en';
}
function setLang(l, first){
  L=l; document.documentElement.lang=l; document.title=t().doc;
  document.getElementById('foot').textContent=t().foot;
  if(!first){ try{localStorage.setItem('lang',l)}catch(_){} dir='none'; render(); }
}

function pct(){ if(cur==='start') return 0; if(cur==='END') return 100; const i=ORDER.indexOf(cur); return Math.max(8,(i<0?ORDER.indexOf(hist[hist.length-1])+.5:i)/ORDER.length*100); }
const progress=()=>`<div class="progress"><span id="prog"></span></div>`;
const backBtn=()=>hist.length?`<button class="btn back" onclick="back()">${t().back}</button>`:'';

function render(){
  if(cur==='start') return start();
  const n=F[cur];
  if(cur==='END') return end();
  if(n.msg){
    const m=t()[cur], again=dir!=='none';
    const liesTxt = cur==='liar' && lies>1 ? `<p class="small reveal" style="animation-delay:.5s">${t().lies(lies)}</p>` : '';
    card.innerHTML=`<div class="body"><div class="msg">
      <div class="emo reveal">${n.emo}</div>
      <div class="big ${n.bad?'bad'+(again?' shake':''):'gt reveal'}" style="animation-delay:.15s">${m.big}</div>
      <p class="reveal" style="animation-delay:.35s">${m.p}</p>${liesTxt}</div></div>
      <div class="actions">${backBtn()}<button class="btn go ${n.bad?'red':''} pop" onclick="goTo('${n.to}')">${m.btn} →</button></div>`+progress();
    if(n.bad && again){card.classList.remove('beat');void card.offsetWidth;card.classList.add('beat');setTimeout(()=>card.classList.remove('beat'),1400)}
    return after();
  }
  const num=['I','II','III','IV','V'][ORDER.indexOf(cur)];
  card.innerHTML=`<div class="body"><div class="qn">${t().q} ${num}</div><h1>${t()[cur].q}</h1><div class="opts" id="opts">`+
    n.o.map((o,i)=>`<button class="opt" style="animation-delay:${80+i*60}ms" onclick="pick(${i},event)"><span class="gem">${o[0]}</span><span>${optLabel(cur,i)}</span></button>`).join('')+
    `</div></div><div class="actions">${backBtn()}</div>`+progress();
  after();
}
function after(){
  const b=card.querySelector('.body'); if(dir!=='none') b.classList.add('in-'+dir);
  const pr=document.getElementById('prog'), to=pct();
  pr.style.width=prevPct+'%'; requestAnimationFrame(()=>requestAnimationFrame(()=>pr.style.width=to+'%')); prevPct=to;
}
function go(d,fn){
  cfx++; const cv=document.getElementById('confetti'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
  dir=d; const b=card.querySelector('.body');
  if(!b){fn();return render()}
  b.classList.remove('in-next','in-back'); b.classList.add('out-'+d);
  setTimeout(()=>{fn();render()},190);
}
function pick(i,e){
  const box=document.getElementById('opts'); if(box.classList.contains('locked')) return;
  box.classList.add('locked');
  const btn=e.currentTarget, r=btn.getBoundingClientRect();
  btn.style.setProperty('--px',(e.clientX?e.clientX-r.left:r.width/2)+'px');
  btn.style.setProperty('--py',(e.clientY?e.clientY-r.top:r.height/2)+'px');
  btn.classList.add('sel');
  const node=cur, o=F[cur].o[i];
  setTimeout(()=>{ picks.push([node,i]); goTo(o[3]); },700);
}
function goTo(to){ if(to==='liar') lies++; go('next',()=>{ hist.push(cur); cur=to; }); }
function back(){
  go('back',()=>{
    cur=hist.pop();
    if(F[cur] && !F[cur].msg) picks.pop();
    while(F[cur] && F[cur].msg && hist.length){ if(cur==='liar') lies=Math.max(0,lies-1); cur=hist.pop(); picks.pop(); }
  });
}
const medal=(inner)=>`<svg class="medal" viewBox="0 0 120 120" aria-hidden="true">
  <g fill="url(#au)" stroke="#3a2705" stroke-width="1">
    ${Array.from({length:16},(_,k)=>`<polygon points="60,2 66,22 54,22" transform="rotate(${k*22.5} 60 60)"/>`).join('')}
  </g>
  <circle cx="60" cy="60" r="40" fill="url(#au)" stroke="#3a2705" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="33" fill="none" stroke="#7a5512" stroke-width="1.5" opacity=".8"/>
  <circle cx="60" cy="60" r="31" fill="url(#auR)"/>
  ${inner}
  <ellipse cx="46" cy="40" rx="14" ry="6" fill="#fff" opacity=".35" transform="rotate(-30 46 40)"/>
</svg>`;
const STAR='<path d="M60 38 L66 53 L82 54 L70 64 L74 80 L60 71 L46 80 L50 64 L38 54 L54 53 Z" fill="#fff6cf" stroke="#8a5f12" stroke-width="1.5" opacity=".95"/>';
const QMARK='<text x="60" y="76" text-anchor="middle" font-family="Cinzel,serif" font-weight="800" font-size="46" fill="#fff6cf" stroke="#8a5f12" stroke-width="1.5">?</text>';
function start(){
  const R=dir==='none'?'':'reveal';
  card.innerHTML=`<div class="body"><div class="start">
    <div class="medal-wrap"><div class="rays-clip"><div class="rays"></div></div>${medal(QMARK)}</div>
    <div class="kick ${R}" style="animation-delay:.25s">${t().kick}</div>
    <h1 class="hero gt ${R}" style="animation-delay:.35s">${t().title}</h1>
    <p class="lead ${R}" style="animation-delay:.5s">${t().lead}</p>
    <button class="btn go ${R}" style="animation-delay:.65s" onclick="goTo('time')">${t().startBtn}</button>
    <div class="meta ${R}" style="animation-delay:.75s">${t().meta}</div>
    <div class="lang ${R}" style="animation-delay:.85s" role="group" aria-label="Language">
      <button data-l="es" class="${L==='es'?'on':''}" onclick="setLang('es')">🇪🇸 Español</button><button data-l="en" class="${L==='en'?'on':''}" onclick="setLang('en')">English 🇬🇧</button></div>
    </div></div>`+progress();
  after();
}
function end(){
  const steps=picks.map(([nd,i])=>`<li>${t()[nd].q} <b>${optLabel(nd,i)}</b></li>`).join('') || `<li>${t().direct}</li>`;
  card.innerHTML=`<div class="body"><div class="msg win">
    <div class="medal-wrap"><div class="rays-clip"><div class="rays"></div></div>${medal(STAR)}</div>
    <div class="qn reveal" style="animation-delay:.4s;margin:0">${t().verdict}</div>
    <div class="big gt reveal" style="animation-delay:.55s">${t().play}</div>
    <p class="reveal" style="animation-delay:.75s">${t().predicted}</p>
    ${lies?`<p class="small reveal" style="animation-delay:.85s">${t().lied(lies)}</p>`:''}
    <details class="path reveal" style="animation-delay:1s"><summary>${t().path}</summary><ol>${steps}</ol></details>
    </div></div>
    <div class="actions">${backBtn()}<button class="btn go pop" onclick="reset()">${t().again}</button></div>`+progress();
  after();
  if(dir!=='none') setTimeout(confetti,650);
}
function reset(){ go('back',()=>{cur='time';hist=[];picks=[];lies=0}); }
// Confeti de pan de oro: cada lámina cambia de brillo al girar
function confetti(){
  const cv=document.getElementById('confetti'), x=cv.getContext('2d'), d=devicePixelRatio;
  const W=cv.width=innerWidth*d, H=cv.height=innerHeight*d;
  const ps=Array.from({length:170},()=>({x:W/2+(Math.random()-.5)*60*d,y:H*.28,vx:(Math.random()-.5)*15*d,vy:(-Math.random()*14-6)*d,
    w:(6+Math.random()*7)*d,h:(9+Math.random()*9)*d,r:Math.random()*6,vr:(Math.random()-.5)*.35,s:Math.random()*6,vs:.15+Math.random()*.2,
    hue:38+Math.random()*10, star:Math.random()<.12}));
  const endT=performance.now()+3800, me=cfx;
  (function f(t){x.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.42*d;p.vx*=.985;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.s+=p.vs;
      const flip=Math.cos(p.s), L=42+Math.abs(Math.sin(p.s))*48; // brillo según la cara que mira
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,Math.min(1,(endT-t)/700));
      x.fillStyle=`hsl(${p.hue} ${L>80?60:85}% ${L}%)`;
      if(p.star){x.fillStyle='#fffbe6';x.shadowColor='#ffd86b';x.shadowBlur=12*d;x.beginPath();
        for(let k=0;k<8;k++){const rr=k%2?p.w*.25:p.w*.9,a=k*Math.PI/4;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.fill();}
      else x.fillRect(-p.w/2,-p.h/2*flip,p.w,p.h*flip);
      x.restore();});
    if(me!==cfx){x.clearRect(0,0,W,H);return}
    if(t<endT) requestAnimationFrame(f); else x.clearRect(0,0,W,H);})(performance.now());
}
setLang(detectLang(), true);
render();
</script>
